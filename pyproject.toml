[project]
name = "multi-user-todo"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3",
  "redis>=5,<6",
  "requests>=2.32,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
